services:
  db:
    image: postgres:16-alpine
    container_name: fixtrack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fixtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fixtrack_pass}
      POSTGRES_DB: ${POSTGRES_DB:-fixtrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixtrack} -d ${POSTGRES_DB:-fixtrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: fixtrack_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fixtrack}:${POSTGRES_PASSWORD:-fixtrack_pass}@db:5432/${POSTGRES_DB:-fixtrack_db}
      SECRET_KEY: ${SECRET_KEY:-fixtrack-docker-dev-secret-change-me}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
    ports:
      - "8000:8000"

volumes:
  postgres_data:
